<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>4 — Pausing</title>
<link rel="stylesheet" href="frame.css" />
<script src="lib.js"></script>
<script src="kit.js"></script>
<style>
  :root { --w: 1280px; --h: 800px; }
  .row { display: flex; justify-content: center; align-items: flex-start; gap: 34px; padding-bottom: 6px; }
  .pop img { display: block; width: 300px; height: 405px; border-radius: 10px; box-shadow: 0 0 0 1px #3a3a3a; }
  .pop .n { margin-top: 18px; font-size: 18px; color: var(--grey); }
  .pop .n b { color: #fff; font-weight: 700; margin-right: 8px; }
  .arr { align-self: center; margin-top: -40px; color: #555; font-size: 30px; }
</style>
</head>
<body>
  <div class="page">
    <div class="cap">
      <h1>To pause it, you have<br />to type a code</h1>
      <p>Then it turns itself back on after an hour.</p>
    </div>
    <div class="stage row">
      <div class="pop"><img src="captures/popup-on.png" /><div class="n"><b>1</b>Blocking is on</div></div>
      <div class="arr">→</div>
      <div class="pop"><img src="captures/popup-code.png" /><div class="n"><b>2</b>Type 4 2 5 7 to pause</div></div>
      <div class="arr">→</div>
      <div class="pop"><img src="captures/popup-paused.png" /><div class="n"><b>3</b>Back on in 60 minutes</div></div>
    </div>
  </div>
<script>document.body.insertAdjacentHTML("afterbegin", mark());</script>
</body>
</html>
