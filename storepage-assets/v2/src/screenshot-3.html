<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Screenshot 3 — Instagram</title>
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" />
<script src="lib.js"></script>
<style>
  :root { --w: 1280px; --h: 800px; }
  .copy { position: absolute; left: 760px; top: 84px; width: 470px; }
  .copy .h1 { font-size: 62px; margin-top: 26px; }
  .copy .sub { font-size: 21px; margin-top: 22px; }
  .stack { position: absolute; left: 744px; top: 418px; width: 486px; display: grid; gap: 12px; }
  .win { left: -70px; top: 84px; width: 760px; height: 780px; }
  .igm { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; background: #000; color: #f5f5f5; font-family: -apple-system, "Helvetica Neue", Roboto, sans-serif; display: flex; }
  .ig-nav { width: 240px; flex: none; border-right: 1px solid #262626; padding: 26px 14px 0 86px; }
  .ig-word { font: 30px "Grand Hotel", cursive; margin: 0 0 26px 8px; }
  .ig-i { display: flex; align-items: center; gap: 14px; height: 46px; padding: 0 8px; font-size: 15px; position: relative; }
  .ig-i svg { width: 24px; height: 24px; flex: none; fill: none; stroke: #f5f5f5; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .ig-i.on { font-weight: 700; }
  .ig-i.on svg { fill: #f5f5f5; }
  .ig-i.gone { opacity: .32; }
  .ig-i.gone::after { content: ""; position: absolute; left: 4px; right: 18px; top: 50%; height: 2px; background: var(--red); opacity: 1; }
  .ig-feed { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 18px; }
  .ig-tabs { width: 380px; display: flex; gap: 22px; font-size: 15px; font-weight: 700; padding-bottom: 14px; }
  .ig-tabs span { display: inline-flex; align-items: center; gap: 6px; }
  .post { width: 380px; }
  .ph { display: flex; align-items: center; gap: 10px; height: 52px; font-size: 14px; }
  .ring { width: 36px; height: 36px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf); }
  .ring i { display: block; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; background: linear-gradient(135deg, #f7b267, #f25c54); }
  .ph b { font-weight: 600; } .ph small { color: #a8a8a8; font-size: 14px; }
  .pimg { width: 380px; height: 440px; border-radius: 6px; overflow: hidden; }
  .pimg svg { width: 100%; height: 100%; display: block; }
  .acts { display: flex; gap: 16px; padding: 12px 0 8px; }
  .acts svg { width: 24px; height: 24px; fill: none; stroke: #f5f5f5; stroke-width: 1.8; stroke-linejoin: round; }
  .likes { font-size: 14px; font-weight: 600; }
  .cap { font-size: 14px; margin-top: 4px; } .cap b { font-weight: 600; }
</style>
</head>
<body>
  <div class="glow" style="width:640px;height:520px;left:-60px;top:220px;background:rgba(184,255,60,.11)"></div>
  <div class="glow" style="width:420px;height:360px;left:960px;top:440px;background:rgba(214,41,118,.10)"></div>

  <div class="copy">
    <div class="eyebrow" id="eb"></div>
    <div class="h1">Only the people<br /><span class="hl">you follow.</span></div>
    <div class="sub">Instagram goes back to your Following feed. Check in on friends, then you're done.</div>
  </div>

  <div class="win">
    <div id="bar"></div>
    <div class="igm">
      <div class="ig-nav">
        <div class="ig-word">Instagram</div>
        <div class="ig-i on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Home</div>
        <div class="ig-i"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>Search</div>
        <div class="ig-i gone"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Explore</div>
        <div class="ig-i gone"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M8 3l3 5.5M13.5 3l3 5.5M10 12v5l4.5-2.5z"/></svg>Reels</div>
        <div class="ig-i"><svg viewBox="0 0 24 24"><path d="M21.5 3 10 13M21.5 3l-7 18-4.5-8-8-4.5z"/></svg>Messages</div>
        <div class="ig-i"><svg viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg>Notifications</div>
        <div class="ig-i"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>Create</div>
        <div class="ig-i"><svg viewBox="0 0 24 24" style="fill:#c9a27e;stroke:none"><circle cx="12" cy="12" r="11"/></svg>Profile</div>
      </div>
      <div class="ig-feed">
        <div class="ig-tabs"><span>Following <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f5f5f5" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></span></div>
        <div class="post">
          <div class="ph"><div class="ring"><i></i></div><b>maya.runs</b><small>• 2h</small><span style="margin-left:auto">•••</span></div>
          <div class="pimg">
            <svg viewBox="0 0 380 440" preserveAspectRatio="xMidYMid slice">
              <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3a6b"/><stop offset=".45" stop-color="#e2747e"/><stop offset=".75" stop-color="#ffc48a"/></linearGradient></defs>
              <rect width="380" height="440" fill="url(#sky)"/>
              <circle cx="250" cy="250" r="44" fill="#fff3c4" opacity=".9"/>
              <path d="M0 290 Q90 220 170 268 T380 250 V440 H0Z" fill="#7b4a6b" opacity=".85"/>
              <path d="M0 330 Q120 280 230 320 T380 300 V440 H0Z" fill="#4c2f52"/>
              <path d="M0 380 Q150 350 380 372 V440 H0Z" fill="#2a1c33"/>
              <path d="M150 440 Q180 395 205 372" stroke="#e7b48f" stroke-width="10" fill="none" opacity=".55" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="acts"><svg viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg><svg viewBox="0 0 24 24"><path d="M20.5 12A8.5 8.5 0 1 1 17 5.1L21 4l-1 4a8.4 8.4 0 0 1 .5 4z"/></svg><svg viewBox="0 0 24 24"><path d="M21.5 3 10 13M21.5 3l-7 18-4.5-8-8-4.5z"/></svg></div>
          <div class="likes">128 likes</div>
          <div class="cap"><b>maya.runs</b> Sunrise 10k with the crew ☀️</div>
        </div>
      </div>
    </div>
  </div>

  <div class="stack" id="stack"></div>
  <div class="grain"></div>
<script>
  inject(RM_CSS);
  document.getElementById("eb").innerHTML = tile("ig", 30) + "Instagram";
  document.getElementById("bar").innerHTML = winBar("<b>instagram.com</b>/?variant=following");
  document.getElementById("stack").innerHTML = [
    rmCard("Reels", "Tab and in-feed reels"),
    rmCard("Explore", "No algorithmic grid to fall into"),
    rmCard("Suggested posts", "Only accounts you follow"),
    rmCard("Suggested accounts", "No “Suggested for you” lists"),
  ].join("");
</script>
</body>
</html>
