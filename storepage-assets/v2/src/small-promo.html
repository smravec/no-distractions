<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Small promo tile</title>
<link rel="stylesheet" href="common.css" />
<script src="lib.js"></script>
<style>
  :root { --w: 440px; --h: 280px; }
  .brand { position: absolute; left: 26px; top: 24px; gap: 12px; }
  .brand-name { font-size: 19px; }
  .h1 { position: absolute; left: 26px; top: 94px; font-size: 35px; line-height: 1.02; letter-spacing: -.04em; }
  .icons { position: absolute; left: 26px; bottom: 26px; }
</style>
</head>
<body>
  <div class="glow" style="width:300px;height:220px;left:220px;top:120px;background:rgba(184,255,60,.20);filter:blur(60px)"></div>
  <div class="brand" id="brand"></div>
  <div class="h1">Block Reels, Shorts<br /><span class="hl">&amp; endless feeds.</span></div>
  <div class="icons" id="icons"></div>
  <div class="grain"></div>
<script>
  document.getElementById("brand").innerHTML = logo(44) + '<span class="brand-name">No Distractions</span>';
  document.getElementById("icons").innerHTML = tiles(36, 10);
</script>
</body>
</html>
